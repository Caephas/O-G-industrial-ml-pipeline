[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ml-pipeline"
version = "0.1.0"
description = "End-to-end predictive maintenance pipeline on NASA C-MAPSS turbofan data: regime-aware features, 4-model inference DAG, model registry, shadow-mode rollouts, PSI drift detection and auto-retraining, REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "predictive-maintenance",
    "cmapss",
    "mlops",
    "machine-learning",
    "remaining-useful-life",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Exact pins (FR-16). New dependencies are added when a feature first needs
# them, after their official docs have been verified for the pinned version.
dependencies = [
    "numpy==2.4.3",
    "pandas==3.0.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
